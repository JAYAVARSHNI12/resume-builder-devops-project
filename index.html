<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color:pink;">
<div class="container">
    <h1>Smart Resume Builder</h1>
    <form id="resumeForm" onsubmit="generateResume(event)">
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number" required>
        </div>
        <div class="input-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter your address" required>
        </div>
        <div class="input-group">
            <label for="skills">Skills</label>
            <textarea id="skills" placeholder="List your skills, separated by commas" required></textarea>
        </div>
        <div class="input-group">
            <label for="education">Education</label>
            <textarea id="education" placeholder="Enter your education details" required></textarea>
        </div>
        <div class="input-group">
            <label for="projects">Project Details</label>
            <textarea id="projects" placeholder="Enter your project details" required></textarea>
        </div>
        <div class="button-row">
            <button type="submit">Generate Resume</button>
            <button type="button" onclick="downloadResume('text')">Download TXT</button>
            <button type="button" onclick="downloadResume('html')">Download HTML</button>
        </div>
    </form>
    <div id="output" class="resume-output"></div>
</div>
<script src="script.js"></script>
</body>
</html>
