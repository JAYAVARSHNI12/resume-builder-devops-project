<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Resume Builder</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- FORM SECTION -->

    <div class="form-section">

        <h1>Smart Resume Builder</h1>

        <input type="text" id="name" placeholder="Full Name">

        <input type="email" id="email" placeholder="Email Address">

        <input type="text" id="phone" placeholder="Phone Number">

        <input type="text" id="address" placeholder="Location">

        <textarea id="summary" placeholder="Professional Summary"></textarea>

        <textarea id="skills" placeholder="Skills"></textarea>

        <textarea id="education" placeholder="Education"></textarea>

        <textarea id="experience" placeholder="Experience"></textarea>

        <textarea id="projects" placeholder="Projects"></textarea>

        <textarea id="languages" placeholder="Languages"></textarea>

        <textarea id="reference" placeholder="Reference"></textarea>

        <input type="file" id="imageInput" accept="image/*">

        <button onclick="generateResume()">
            Generate Resume
        </button>

        <button onclick="window.print()">
            Download PDF
        </button>

    </div>

    <!-- RESUME SECTION -->

    <div class="resume-section">

        <div class="resume-template" id="output">

            <!-- LEFT COLUMN -->

            <div class="left-column">

                <img id="profileImage"
                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                alt="Profile Image">

                <h2 id="outName">Your Name</h2>

                <p>
                    <i class="fa-solid fa-envelope"></i>
                    <span id="outEmail">email@gmail.com</span>
                </p>

                <p>
                    <i class="fa-solid fa-phone"></i>
                    <span id="outPhone">9876543210</span>
                </p>

                <p>
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="outAddress">Chennai</span>
                </p>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-code"></i>
                        Skills
                    </h3>

                    <p id="outSkills"></p>

                </div>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-language"></i>
                        Languages
                    </h3>

                    <p id="outLanguages"></p>

                </div>

            </div>

            <!-- RIGHT COLUMN -->

            <div class="right-column">

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-user"></i>
                        Professional Summary
                    </h3>

                    <p id="outSummary"></p>

                </div>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-graduation-cap"></i>
                        Education
                    </h3>

                    <p id="outEducation"></p>

                </div>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-briefcase"></i>
                        Experience
                    </h3>

                    <p id="outExperience"></p>

                </div>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-diagram-project"></i>
                        Projects
                    </h3>

                    <p id="outProjects"></p>

                </div>

                <div class="resume-block">

                    <h3>
                        <i class="fa-solid fa-address-book"></i>
                        Reference
                    </h3>

                    <p id="outReference"></p>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
